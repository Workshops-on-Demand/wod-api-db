# Use postgres/example user/password credentials
services:

  db:
    image: postgres
    container_name: postgres
    pull_policy: always
    restart: always
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    user: ${WODUID}:${WODGID}
    environment:
      POSTGRES_USER: ${WODPGUSER}
      POSTGRES_PASSWORD: ${WODPGPASSWD}
      POSTGRES_DB: ${WODPGDB}
      PGDATA: /var/lib/postgresql/data/apertis-qa-report
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: always
    pull_policy: always
    ports:
      - "8083:8080"
    depends_on:
      db:
        condition: service_healthy
